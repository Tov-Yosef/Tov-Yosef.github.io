eyebrow: "A Self-Portrait in Progress"
hero_name: "The Person"
hero_sub: "Tov · Teacher · Artist · Bard · Dreamer of Nations"
preamble: "I did not find my path. *I followed a question until the path found me.*"

sections:
  - title: "The Engine"
    body: |
      Everything I am runs on a single question: how do I become a better person? That question has taken me further than I expected. It rewrote my religion. It will probably rewrite several more things before I am done.

      My faith is Jewish — and it is not background noise. It is the organizing principle of how I think about obligation, community, and what it means to do good work in an unfinished world.

  - title: "The Callings"
    body: |
      I want to be a Rabbi. Not for the title — for the work. To guide, to teach, to be genuinely responsible to a community. The calling is old and it is real.

      I am also an artist. Visual art, writing, performance, game design — not because I cannot choose, but because the inner world is too large for a single medium. I am a systems thinker who makes things. A researcher who cannot stop finding connections. A teacher who learns by teaching.

      These are not separate callings. They are the same person working across different surfaces.

  - title: "The Bard"
    body: |
      There is a version of me that is loud, alive, magnetic — the one who held rooms and told stories and made people feel like something was happening. That version is still here. He is not gone. He is conserving. Building toward something larger than any room.

      I live with deep games — Magic: The Gathering for its architecture, Dungeons & Dragons for its collaborative dreaming, Torah for both. I find the same pleasure in all of them: the pleasure of a system that rewards genuine attention.

  - title: "The Direction"
    body: |
      I am building toward Tzfat — its mysticism, its history, its particular frequency. I am building toward a community that does not yet have a name. I am building toward a body of work that holds art and doctrine and law in the same hand.

      This website is part of that build. You are reading an early chapter.
