eyebrow: "A Total Creative Project"
hero_name: "The Project"
hero_sub: "A world built outward from one person's inner life"
preamble: "This is not a business plan. This is not a novel. This is *the architecture of a civilization that does not exist yet* — projected from values that already do."

sections:
  - title: "What This Is"
    body: |
      Every civilization begins somewhere. A person. A question. A refusal to accept the world as it is. This project begins there — with one person's inner life — and builds outward through art, doctrine, community, and law until it arrives at something that has never existed before.

      Every document produced here is real. Every institution designed here is designed as if it will be inhabited. The world-building is not decorative. It is the inner work made external and explorable. Doesn't mean take the doctrine as doctrine, but as inspiration!

  - title: "The Sequence"
    body: |
      The project unfolds in phases. Each phase earns the next. We begin with what is real and personal — a person, documented and present. Then values become doctrine. Then doctrine becomes community. Then community becomes law. Then law becomes a nation.

      We are currently in a phase of Real and Personal. The person is being established before the vision. Credibility before scale. Presence before power.

  - title: "Real & Personal"
    body: "The person before the vision. A resume. A portrait. A body of work. The only phase that exists purely in reality — everything after begins to blur the line."

  - title: "Ideological"
    body: "Values become doctrine. The manifesto — the bridge between personal and political. The document everything else cites. Written as if we expect to be held to it."

  - title: "Political"
    body: "The ideology enters civic life. A non-profit. A campaign. A party. A commune. These are laboratories for what a city, or nation could look like."

  - title: "Symbolic Identity"
    body: "Explore what currency is and can be, play with flag designs as identity and movement. How does symbolism break from the abstract and touch the real?"

  - title: "Civic Infrastructure"
    body: "The skeleton of a society. A constitution. A judicial system. A citizenship framework. An academy. A canon of texts. Each document real in intention, internally seeking consistency with all the others."

  - title: "Where We Are"
    body: |
      The personal and real is active, being documented and work is being gathered. The portrait is being written. This website is the public home of the project at every stage — not a phase of the work, but the container all phases live inside.

      You are reading an early page of a very long book.
