eyebrow: "A Total Creative Project"
hero_name: "The Project"
hero_sub: "A world built outward from one person's inner life"
preamble: "This is not a business plan. This is not a novel. This is *the architecture of a civilization that does not exist yet* — projected from values that already do."

sections:
  - title: "What This Is"
    body: |
      Every civilization begins somewhere. A person. A question. A refusal to accept the world as it is. This project begins there — with one person's inner life — and builds outward through art, doctrine, community, and law until it arrives at something that has never existed before.

      Every document produced here is real. Every institution designed here is designed as if it will be inhabited. The world-building is not decorative. It is the inner work made external and explorable.

  - title: "The Sequence"
    body: |
      The project unfolds in phases. Each phase earns the next. We begin with what is real and personal — a person, documented and present. Then values become doctrine. Then doctrine becomes community. Then community becomes law. Then law becomes a nation.

      We are currently in Phase I — Real and Personal. The person is being established before the vision. Credibility before scale. Presence before power.

  - title: "I · Real & Personal"
    body: "The person before the vision. A resume. A portrait. A body of work. The only phase that exists purely in reality — everything after begins to blur the line."

  - title: "II · Ideological"
    body: "Values become doctrine. The manifesto — the bridge between personal and political. The document everything else cites. Written as if we expect to be held to it."

  - title: "III · Community at Human Scale"
    body: "Live it before you legislate it. A commune. A governing document. A guild. These are laboratories — what works here gets scaled, what breaks here gets revised before it becomes law."

  - title: "IV · Political"
    body: "The ideology enters civic life. A non-profit. A campaign. A party. The manifesto in motion — tested against the real world before it ossifies into a platform."

  - title: "V · The City"
    body: "The project becomes spatial. A city designed not as a map but as a feeling made physical. The capital in waiting — where the first institutions are born."

  - title: "VI · Symbolic Identity"
    body: "The movement gets a face. A flag. A visual language. A currency that reflects the civilization's relationship to labor and mutual obligation. The name that unlocks everything."

  - title: "VII · Civic Infrastructure"
    body: "The skeleton of a society. A constitution. A judicial system. A citizenship framework. An academy. A canon of texts. Each a real document, internally consistent with all the others."

  - title: "VIII · The Nation"
    body: "Everything crystallizes. The full synthesis — government, culture, history, identity — given a name and a border. The accumulation of everything that came before."

  - title: "Where We Are"
    body: |
      Phase I is active. The person is being documented. The work is being gathered. The portrait is being written. This website is the public home of the project at every stage — not a phase of the work, but the container all phases live inside.

      You are reading an early page of a very long book.
