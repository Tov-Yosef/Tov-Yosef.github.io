eyebrow: "The Ideology in Progress"
hero_name: "The Vision"
hero_sub: "What is worth building · What is worth becoming"
preamble: "The manifesto is being written. The doctrine is taking shape. *This page will not be empty for long.*"

sections:
  - title: "What We Believe"
    body: |
      The world is unfinished. That is not a tragedy — it is an assignment. Every generation inherits an incomplete world and is obligated to push it closer to whole. Not perfect. Closer.

      We believe that obligation is not a burden. It is the shape of a meaningful life.

  - title: "What We Are Building Toward"
    body: |
      A civilization that takes seriously the things most civilizations treat as decoration — rest, the stranger, the dignity of labor, the passing of knowledge, the sacred weight of argument. These are not ideals. They are load-bearing walls.

      We are building toward a community that does not yet have a name. A city that does not yet have a map. A nation that does not yet have soil. But the values are already here. The foundation is already being poured.

  - title: "What Comes Next"
    body: |
      The manifesto. The commune. The guild. The campaign. The constitution. Each document earned by the one before it. Each institution explored before it becomes law.

      This page will grow as the project grows. Return to it. It will not look the same twice.
