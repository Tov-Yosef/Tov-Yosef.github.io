<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} · {{ site.tagline }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>

  <div class="flag-bar"></div>

  <nav class="nav">
    <a href="{{ '/' | relative_url }}" style="text-decoration: none;">
      <div class="nav-seal">
        <div class="seal-circle">
          <div class="seal-inner">T</div>
        </div>
        <div class="seal-text">{{ site.title }}</div>
      </div>
    </a>

    <button class="hamburger" id="hamburger" aria-label="Open navigation">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <ul class="nav-links" id="nav-links">
      <li><a href="{{ '/about/' | relative_url }}">The Person</a></li>
      <li><a href="{{ '/work/' | relative_url }}">The Work</a></li>
      <li><a href="{{ '/vision/' | relative_url }}">The Vision</a></li>
      <li><a href="{{ '/project/' | relative_url }}">The Project</a></li>
    </ul>

    <div class="nav-right">Phase I<br>Real &amp; Personal</div>
  </nav>

  <main>
    {{ content }}
  </main>

  <div class="phase-footer">
    <div class="phase-left">
      <div class="phase-dot"></div>
      <div class="phase-text">Phase I · Real &amp; Personal · Active</div>
    </div>
    <div class="phase-text">The Project · Living Document</div>
    <div class="phase-text">{{ site.title }} · 2025</div>
  </div>

  <div class="flag-bar-bottom"></div>

  <script>
    const hamburger = document.getElementById('hamburger');
    const navLinks = document.getElementById('nav-links');
    hamburger.addEventListener('click', () => {
      navLinks.classList.toggle('open');
      hamburger.classList.toggle('active');
    });
  </script>

</body>
</html>
